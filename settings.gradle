pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

// 相邻仓库位置、产物路径与第三方版本都由 Framework 的工作区脚本提供（kizunaWorkspace、libs）。
apply from: new File(rootDir.parentFile, 'Kizuna-Meridian-Mod-Framework/scripts/workspace.gradle')

rootProject.name = 'kizuna-meridian-items-addon'

// 上游尚未发布坐标；按清单目录组合独立仓库的实际工程，不复制源码或协议。
kizunaWorkspace.includeSource('framework', [server: 'local.meridian:server'])
// Inventory UI 的替换键用其工程自身的 group 与工程名，与 Human 等仓的登记一致：同一仓库在嵌套组合里只按最先登记的规则替换，键不一致时另一方解析不到。
kizunaWorkspace.includeSource('inventory-ui', [server: 'dev.kizuna.inventoryui:server'])
kizunaWorkspace.includeSource('bs3d', [server: 'local.bs3d:server'])
