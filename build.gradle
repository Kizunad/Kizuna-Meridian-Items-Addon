plugins {
    id 'java-library'
    alias(libs.plugins.fabric.loom)
    alias(libs.plugins.protobuf)
}

group = 'dev.kizuna.meridian.items'
version = '0.1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger()) }
    withSourcesJar()
}

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    // 组合工程按坐标替换为上游源码工程，直接取其普通 JAR。
    api 'dev.kizuna.backpack3d:server'
    compileOnly 'dev.kizuna.inventoryui:server'
    api 'local.meridian:server'
    api libs.protobuf.java
}

tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.java.get().toInteger()
    options.encoding = 'UTF-8'
}

def descriptor = layout.buildDirectory.file('descriptors/items-v1.desc')
protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" }
    generateProtoTasks {
        ofSourceSet('main').configureEach { task ->
            task.generateDescriptorSet = true
            task.descriptorSetOptions.path = descriptor.get().asFile.path
            task.descriptorSetOptions.includeImports = true
            task.descriptorSetOptions.includeSourceInfo = true
        }
    }
}

processResources {
    dependsOn tasks.named('generateProto')
    from(descriptor) { into 'META-INF/kizuna_meridian_items/protocol' }
}

tasks.withType(Jar).configureEach {
    from('LICENSE', 'LICENSE-BS3D', 'NOTICE', 'THIRD_PARTY_NOTICES.md')
}

// 作为宿主的服务端库交付；不自动安装事件、内容或独立网络通道。
tasks.register('protocolZip', Zip) {
    dependsOn tasks.named('generateProto')
    archiveClassifier = 'proto'
    from('src/main/proto')
    from(descriptor) { into 'descriptors' }
    from('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md')
}
tasks.named('assemble') { dependsOn tasks.named('protocolZip') }
